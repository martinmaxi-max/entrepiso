<style>
  :root{
    --bg:#15171a; --panel:#1f2329; --panel2:#252a31; --border:#333941; --accent:#e07b2a;
    --navy:#1e3a5f; --navy-light:#2d5a8f; --text:#e8eaed; --muted:#878d96;
    --success:#4caf7d; --danger:#e0524f; --warning:#d4a017; --info:#5b9bd5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,Segoe UI,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  input,select{background:#15171a;color:var(--text);border:1px solid var(--border);border-radius:5px;padding:9px 11px;font-size:13px;outline:none;width:100%;font-family:inherit}
  input:focus,select:focus{border-color:var(--accent)}
  input::placeholder{color:var(--muted)}
  select option{background:var(--panel)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:5px;font-weight:600}
  .btn{background:var(--accent);color:#fff;padding:9px 16px;font-size:13px}
  .btn:hover{background:#c96b1a}
  .btn-sm{padding:5px 11px;font-size:12px}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .btn-ghost:hover{border-color:var(--muted)}
  .btn-danger{background:#3a1a1a;color:var(--danger);border:1px solid #5a2a2a}
  .btn-success{background:#16321f;color:var(--success);border:1px solid #235038}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{color:var(--muted);font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  td{padding:10px 12px;border-bottom:1px solid #23272d;vertical-align:middle}
  tr:hover td{background:var(--panel2)}
  tfoot td{border-top:2px solid var(--border);border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px}
  .muted{color:var(--muted)}
  .badge{padding:2px 9px;border-radius:11px;font-size:11px;font-weight:600;display:inline-block;white-space:nowrap}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  /* LOGIN */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(circle at 50% 30%, #1f2329 0%, #15171a 70%)}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:36px 32px;width:100%;max-width:380px;text-align:center}
  .login-logo{width:84px;height:84px;border-radius:50%;margin:0 auto 18px;display:block;box-shadow:0 4px 24px rgba(0,0,0,.4)}

  /* HEADER */
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:0 22px;position:sticky;top:0;z-index:50}
  .hrow{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:40px;height:40px;border-radius:50%}
  .brand .bn{font-weight:800;font-size:15px;letter-spacing:.02em}
  .brand .bs{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.18em;margin-top:-1px}
  .tabs{display:flex;gap:2px;overflow-x:auto}
  .tab{padding:9px 15px;background:transparent;color:var(--muted);border-bottom:2px solid transparent;font-weight:500;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
  .wrap{padding:22px;max-width:1320px;margin:0 auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:15px 18px}
  .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
  .stat .val{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .sub{font-size:11px;color:var(--muted);margin-top:4px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .toolbar h2{font-size:16px;font-weight:700}
  .toolbar .sub{font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}
  .field{margin-bottom:13px;text-align:left}
  .field-lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:10px;width:100%;max-width:540px;max-height:92vh;overflow:auto}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px}
  .modal-body{padding:20px}
  .modal-x{background:none;color:var(--muted);font-size:22px;line-height:1}
  .alert{border-radius:8px;padding:13px 16px;margin-bottom:16px;font-size:13px;line-height:1.5}
  .alert-warn{background:#3a2a15;border:1px solid rgba(212,160,23,.4)}
  .alert-ok{background:#16321f;border:1px solid rgba(76,175,125,.4)}
  .empty{text-align:center;color:var(--muted);padding:42px}
  .seg{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}
  .seg button{flex:1;min-width:90px;padding:9px;border-radius:6px;font-weight:600;font-size:12px;border:1px solid var(--border);background:transparent;color:var(--muted)}
  .socio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
  .socio-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;border-top:3px solid var(--navy)}
  .socio-card .nm{font-weight:700;font-size:15px;margin-bottom:3px}
  .socio-card .tot{font-size:24px;font-weight:800;color:var(--success);font-variant-numeric:tabular-nums;margin:8px 0 4px}
  .conc-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:720px){.conc-row{grid-template-columns:1fr}}
  .check-pend{cursor:pointer;width:18px;height:18px;border-radius:4px;border:2px solid var(--border);display:inline-flex;align-items:center;justify-content:center;background:transparent}
  .check-pend.done{background:var(--success);border-color:var(--success);color:#fff}
</style>

// ════════════════════════════════════════════════════════════════════════
// ENTREPISO SAS — Motor v2.1
// Modelo: Ingresos y Gastos como planillas madre. Cada movimiento marca
// si toca CAJA (conciliada) o BANCO (saldo manual). E-cheques con proyección
// por día. Socios con 3 subcuentas (aportes − retiros). Cuentas de egreso
// administrables (Bienes de Uso con ficha propia). Resumen por centro de costo.
// Capa DB abstraída para migrar a Firebase reescribiendo solo DB.* y Session.*
// ════════════════════════════════════════════════════════════════════════

const SOCIOS = ["Maximiliano Martín", "Sergio Pringles", "Gastón Turcato"];
// Centros de costo: administrables, viven en DB. Helper para leerlos.
function centrosCosto() {
  const d = DB.get();
  if (!d.centrosCosto || !d.centrosCosto.length) { d.centrosCosto = ["General"]; DB.save(); }
  return d.centrosCosto;
}
function listaProveedores() { const d = DB.get(); if (!d.proveedores) { d.proveedores = []; DB.save(); } return d.proveedores; }
function listaClientes() { const d = DB.get(); if (!d.clientes) { d.clientes = []; DB.save(); } return d.clientes; }
// Cada proveedor/cliente puede ser string (modelo viejo) u objeto {razonSocial,cuit,domicilio,telefono}
const nombreDe = x => typeof x === "string" ? x : (x.razonSocial || "");
function nombresLista(lista) { return lista.map(nombreDe); }
function buscarEnLista(lista, nombre) { return lista.find(x => nombreDe(x) === nombre); }

// Tipos de INGRESO  → destino: caja | banco
const TIPOS_INGRESO = ["Cobranzas", "Aportes Socios", "Otros Ingresos"];
// Cuentas de EGRESO: administrables, viven en DB (podés crear nuevas al vuelo)
const TIPOS_GASTO_BASE = ["Proveedores", "Sueldos", "Mano de Obra", "Honorarios", "Cargas Sociales", "Gastos Bancarios", "Impuestos", "Bienes de Uso", "Retiros", "Gastos varios", "Otros"];
function tiposGasto() {
  const d = DB.get();
  if (!d.tiposGasto || !d.tiposGasto.length) { d.tiposGasto = [...TIPOS_GASTO_BASE]; DB.save(); }
  return d.tiposGasto;
}
// Formas de pago de un gasto → impacto
const FORMAS_PAGO = [
  { id: "efectivo",      label: "Caja (efectivo)" },
  { id: "cajachica",     label: "Caja chica" },
  { id: "transferencia", label: "Transferencia (banco)" },
  { id: "echeque",       label: "E-cheque" },
  { id: "ctacte",        label: "Cuenta Corriente" },
];

// ════════════════════════════════════════════════════════════════════════
// CAPA DE DATOS
// ════════════════════════════════════════════════════════════════════════
// ═══ CAPA DE DATOS SOBRE FIRESTORE ═══
// Todo el estado vive en un único documento: entrepiso/estado
// _data en memoria (síncrono como antes); cada save() lo sube; onSnapshot refresca todas las máquinas.
const DB = {
  _data: null,
  _docRef: null,
  _default() {
    return {
      centrosCosto: ["General"], proveedores: [], clientes: [], tiposGasto: [...TIPOS_GASTO_BASE],
      ingresos: [], gastos: [], cheques: [], ajustesCaja: [],
      transfCajaChica: [], ajustesCajaChica: [], saldoInicialCajaChica: 0, responsableCajaChica: "",
      saldoInicialCaja: 0, saldoBancoManual: 0, saldoBancoFecha: "",
    };
  },
  _subscribe() {
    const { db, doc, onSnapshot } = window.FB;
    this._docRef = doc(db, "entrepiso", "estado");
    onSnapshot(this._docRef, snap => {
      if (snap.exists()) { this._data = snap.data(); this._migrar(); }
      else { this._data = this._default(); this._pushRemote(); }
      render();
    }, err => { console.error("Firestore:", err); });
  },
  async _pushRemote() {
    try { await window.FB.setDoc(this._docRef, JSON.parse(JSON.stringify(this._data))); }
    catch (e) { console.error("Error guardando:", e); alert("No se pudo guardar en la nube. Revisá tu conexión."); }
  },
  // Completa las claves nuevas que un documento viejo todavía no tenga.
  // No borra ni modifica nada de lo ya cargado.
  _migrar() {
    const base = this._default();
    Object.keys(base).forEach(k => {
      if (this._data[k] === undefined) this._data[k] = Array.isArray(base[k]) ? [] : base[k];
    });
    return this._data;
  },
  load() { if (!this._data) this._data = this._default(); return this._data; },
  save() { this._pushRemote(); },
  get() { return this._data || this._default(); },
  add(coll, obj) { obj.id = uid(); this.get()[coll].push(obj); this.save(); return obj; },
  update(coll, id, patch) { const it = this.get()[coll].find(x => x.id === id); if (it) { Object.assign(it, patch); this.save(); } return it; },
  remove(coll, id) {
    const d = this.get();
    d[coll] = d[coll].filter(x => x.id !== id);
    if (coll === "gastos") d.cheques = d.cheques.filter(c => c.refGasto !== id);
    if (coll === "ingresos") d.cheques = d.cheques.filter(c => c.refIngreso !== id);
    this.save();
  },
  setMeta(k, v) { this.get()[k] = v; this.save(); },
};

// CÁLCULOS
// ════════════════════════════════════════════════════════════════════════
// CAJA: conciliada. saldo = inicial + ingresos a caja − gastos en efectivo + ajustes
function saldoCaja() {
  const d = DB.get();
  let s = d.saldoInicialCaja || 0;
  d.ingresos.forEach(i => {
    if (i.cobros && i.cobros.length) { s += i.cobros.filter(c => c.forma === "efectivo").reduce((a, c) => a + c.importe, 0); }
    else if (i.destino === "caja") s += i.importe;
  });
  d.gastos.forEach(g => { s -= montoPorForma(g, "efectivo"); });
  (d.ajustesCaja || []).forEach(a => s += a.importe);
  // la plata que se pasa a la caja chica sale de la caja general
  (d.transfCajaChica || []).forEach(t => { if (t.origen === "caja") s -= t.importe; });
  return s;
}

// ── CAJA CHICA ──
// Se fondea con transferencias desde la caja general o desde el banco, y se gasta
// registrando egresos con forma de pago "cajachica".
function transfsCC() { const d = DB.get(); if (!d.transfCajaChica) d.transfCajaChica = []; return d.transfCajaChica; }
function ajustesCC() { const d = DB.get(); if (!d.ajustesCajaChica) d.ajustesCajaChica = []; return d.ajustesCajaChica; }
function saldoCajaChica() {
  const d = DB.get();
  let s = d.saldoInicialCajaChica || 0;
  (d.transfCajaChica || []).forEach(t => s += t.importe);
  d.gastos.forEach(g => { s -= montoPorForma(g, "cajachica"); });
  (d.ajustesCajaChica || []).forEach(a => s += a.importe);
  return s;
}
// suma cuánto de un gasto se pagó con una forma dada (soporta pagos mixtos y modelo viejo)
function montoPorForma(g, forma) {
  if (g.pagos && g.pagos.length) return g.pagos.filter(p => p.forma === forma).reduce((a, p) => a + p.importe, 0);
  // modelo viejo: forma única
  if (g.forma === forma && g.estado === "pagado") return g.importe;
  return 0;
}
// cuánto queda pendiente (cta cte) de un gasto — soporta pagos mixtos y modelo viejo
function pendienteDe(g) {
  if (g.pagos && g.pagos.length) return g.estado === "pendiente" ? (g.montoPendiente || 0) : 0;
  return g.estado === "pendiente" ? g.importe : 0;
}
// BANCO: saldo 100% manual
function saldoBanco() { return DB.get().saldoBancoManual || 0; }
function chequesPendientes() { return DB.get().cheques.filter(c => c.estado === "pendiente"); }
// tipo por defecto "emitido" para compatibilidad con cheques viejos
function chequeEsRecibido(c) { return c.tipo === "recibido"; }
function chequesEmitidosPend() { return chequesPendientes().filter(c => !chequeEsRecibido(c)); }
function chequesRecibidosPend() { return chequesPendientes().filter(c => chequeEsRecibido(c)); }
function totalEmitidosPend() { return chequesEmitidosPend().reduce((a, c) => a + c.importe, 0); }
function totalRecibidosPend() { return chequesRecibidosPend().reduce((a, c) => a + c.importe, 0); }
function chequesPendientesTotal() { return totalEmitidosPend(); } // compat: lo "a cubrir" son los emitidos
// saldo proyectado = saldo real − emitidos pendientes + recibidos pendientes
function saldoBancoProyectado() { return saldoBanco() - totalEmitidosPend() + totalRecibidosPend(); }

// Proyección por día: cada cheque pendiente con su signo (emitido resta, recibido suma)
function proyeccionBanco() {
  const pend = chequesPendientes().filter(c => c.fechaPago).sort((a, b) => a.fechaPago.localeCompare(b.fechaPago));
  const porDia = {};
  pend.forEach(c => { (porDia[c.fechaPago] = porDia[c.fechaPago] || []).push(c); });
  let saldo = saldoBanco();
  return Object.keys(porDia).sort().map(fecha => {
    const items = porDia[fecha];
    const egresos = items.filter(c => !chequeEsRecibido(c)).reduce((a, c) => a + c.importe, 0);
    const ingresos = items.filter(c => chequeEsRecibido(c)).reduce((a, c) => a + c.importe, 0);
    const totalDia = ingresos - egresos; // neto del día
    const saldoAntes = saldo;
    saldo += totalDia;
    return { fecha, items, egresos, ingresos, totalDia, saldoAntes, saldoDespues: saldo, cubrir: saldo < 0 ? -saldo : 0 };
  });
}

// SOCIOS: aportes (ingresos tipo aporte) − retiros (gastos tipo retiro)
function socioResumen(nombre) {
  const d = DB.get();
  let aportes = 0, retiros = 0, ultimaFecha = "";
  d.ingresos.forEach(i => { if (i.tipo === "Aportes Socios" && i.socio === nombre) { aportes += i.importe; if ((i.fecha || "") > ultimaFecha) ultimaFecha = i.fecha; } });
  d.gastos.forEach(g => { if (g.tipo === "Retiros" && g.socio === nombre) { retiros += g.importe; if ((g.fecha || "") > ultimaFecha) ultimaFecha = g.fecha; } });
  return { aportes, retiros, neto: aportes - retiros, ultimaFecha };
}
function deudaProveedores() {
  return DB.get().gastos.reduce((a, g) => a + pendienteDe(g), 0);
}
// CLIENTES: cuentas por cobrar (cobranzas con parte en cta cte)
function porCobrarTotal() {
  return DB.get().ingresos.reduce((a, i) => a + (i.estado === "pendiente" ? (i.montoPendiente || 0) : 0), 0);
}
function clienteResumen(nombre) {
  const d = DB.get();
  let facturado = 0, pendiente = 0, ultimaFecha = "";
  d.ingresos.forEach(i => {
    if (i.tipo === "Cobranzas" && i.cliente === nombre) {
      facturado += i.importe;
      if (i.estado === "pendiente") pendiente += (i.montoPendiente || 0);
      if ((i.fecha || "") > ultimaFecha) ultimaFecha = i.fecha;
    }
  });
  return { facturado, pendiente, ultimaFecha };
}

// Genera impacto de un gasto (cheques) al confirmarse
function generarCheques(g) {
  // junta cheques de las líneas de pago (modelo nuevo) o del campo viejo
  let lista = [];
  if (g.pagos && g.pagos.length) {
    g.pagos.forEach(p => { if (p.forma === "echeque" && p.cheques) lista = lista.concat(p.cheques); });
  } else if (g.forma === "echeque" && g.cheques) {
    lista = g.cheques;
  }
  lista.forEach(c => {
    if (!DB.get().cheques.some(x => x.refGasto === g.id && x.nro === c.nro && x.fechaPago === c.fechaPago && x.importe === c.importe)) {
      DB.add("cheques", { tipo: "emitido", fechaEmision: g.fecha, fechaPago: c.fechaPago, nro: c.nro, beneficiario: g.proveedor || g.tipo, importe: c.importe, refGasto: g.id, estado: "pendiente" });
    }
  });
}

function saveIngreso() {
  const imp = parseFloat(document.getElementById("i_imp").value || 0); if (!imp) return;

  const o = { fecha: document.getElementById("i_fecha").value, tipo, importe: imp, proyecto: document.getElementById("i_proy").value, detalle: document.getElementById("i_det").value.trim() };

    const c = document.getElementById("i_cliente"); if (c && c.value && c.value !== "__nuevo__") o.cliente = c.value.trim();
    const ft = document.getElementById("i_factipo"); if (ft) o.facturaTipo = ft.value;
    const fn = document.getElementById("i_facnro"); if (fn) o.facturaNro = fn.value.trim();
  }
  // reparto en cobros (los tres tipos): lo no asignado queda pendiente en cta cte
  const asignado = cobrosTemp.reduce((a, x) => a + x.importe, 0);
  const cobros = cobrosTemp.map(x => ({ ...x }));
  const pendiente = imp - asignado;
  if (pendiente > 0.5) cobros.push({ forma: "ctacte", importe: pendiente });
  o.cobros = cobros;
  o.montoPendiente = pendiente > 0.5 ? pendiente : 0;
  o.estado = pendiente > 0.5 ? "pendiente" : "cobrado";
  o.destino = cobros.some(x => x.forma === "efectivo") ? "caja" : "banco";
  // generar cheques recibidos si hubo e-cheque en el reparto
  if (window._editIngresoId) {
    const dd = DB.get(); dd.cheques = dd.cheques.filter(ch => ch.refIngreso !== window._editIngresoId); DB.save();
    DB.update("ingresos", window._editIngresoId, o);
    generarChequesRecibidos(DB.get().ingresos.find(x => x.id === window._editIngresoId));
    window._editIngresoId = null;
  } else {
    const saved = DB.add("ingresos", o);
    generarChequesRecibidos(saved);
  }
  cobrosTemp = []; chequesTemp = [];
  closeModal(); render();
}
// genera cheques recibidos a partir de las líneas e-cheque de un ingreso
function generarChequesRecibidos(ing) {
  if (!ing || !ing.cobros) return;
  ing.cobros.forEach(c => {
    if (c.forma === "echeque" && c.cheques) {
      c.cheques.forEach(ch => {
        if (!DB.get().cheques.some(x => x.refIngreso === ing.id && x.nro === ch.nro && x.fechaPago === ch.fechaPago && x.importe === ch.importe)) {
          DB.add("cheques", { tipo: "recibido", fechaEmision: ing.fecha, fechaPago: ch.fechaPago, nro: ch.nro, beneficiario: ing.cliente || ing.socio || "Cobro", importe: ch.importe, refIngreso: ing.id, estado: "pendiente" });
        }
      });
    }
  });
}

    const formas = (g.pagos && g.pagos.length) ? g.pagos.map(p => p.forma) : (g.forma ? [g.forma] : []);

    </div>
    <div class="panel" style="overflow:hidden">
      ${gastos.length === 0 ? `<div class="empty">No hay gastos cargados.</div>` :
      `<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Cuenta</th><th>Proveedor / Detalle</th><th>C. costo</th><th>Forma</th><th class="num">Importe</th><th>Estado</th><th></th></tr></thead><tbody>
      ${gastos.map(g => `<tr>

        <td>${g.estado === "pendiente" ? `<button class="btn-success btn btn-sm" onclick="openSaldarModal('${g.id}')">Saldar →</button>` : `<span class="badge" style="background:var(--success)22;color:var(--success)">Pagado</span>`}</td>

function gTipoChange() {
  const sel = document.getElementById("g_tipo");

  if (sel.value === "__nueva__") {
    const v = prompt("Nombre de la nueva cuenta de egreso:");
    if (v && v.trim()) {
      const nombre = v.trim();
      const d = DB.get(); if (!d.tiposGasto || !d.tiposGasto.length) d.tiposGasto = [...TIPOS_GASTO_BASE];
      if (!d.tiposGasto.includes(nombre)) { d.tiposGasto.push(nombre); DB.save(); }
      const o = document.createElement("option"); o.text = nombre; o.selected = true;
      sel.add(o, sel.options[sel.options.length - 1]);

  }
  const t = sel.value;
  const ex = document.getElementById("g_tipoextra");
  // El proveedor/beneficiario se elige en TODAS las cuentas (honorarios, gastos varios,
  // mano de obra, etc.), salvo en Retiros donde el destinatario es un socio.
  const campoProv = `<div class="field"><label class="field-lbl">Proveedor / a nombre de <span class="muted" style="text-transform:none;letter-spacing:0">(opcional)</span></label>${selectConNuevo("g_prov", listaProveedores(), "", "proveedores")}</div>`;

  else if (t === "Bienes de Uso") { ex.innerHTML = campoProv + `<div id="g_bienes"></div>`; renderBienesTemp(); }

}

  const obj = { razonSocial: razon, cuit: document.getElementById("ne_cuit").value.trim(), telefono: document.getElementById("ne_tel").value.trim(), domicilio: document.getElementById("ne_dom").value.trim() };
  const d = DB.get(); if (!d[tipo]) d[tipo] = [];
  if (!d[tipo].some(x => nombreDe(x) === razon)) { d[tipo].push(obj); DB.save(); }
  closeModal2();
  // re-seleccionar en el select original (que sigue en el modal de abajo)
  const sel = document.getElementById(selectId);
  if (sel) {
    if (![...sel.options].some(o => o.text === razon)) {
      const o = document.createElement("option"); o.text = razon;
      sel.add(o, sel.options[sel.options.length - 1]);
    }
    sel.value = razon;
  }
}

function saveGasto() {
  const impTotal = parseFloat(document.getElementById("g_imp").value || 0);
  const tipo = document.getElementById("g_tipo").value;
  if (tipo === "__nueva__") { alert("Elegí una cuenta para el egreso."); return; }
  const provEl = document.getElementById("g_prov");
  let proveedor = (provEl && provEl.value !== "__nuevo__") ? provEl.value.trim() : "";
  if (pagosTemp.length === 0) { alert("Agregá al menos una forma de pago."); return; }
  const asignado = pagosTemp.reduce((a, p) => a + p.importe, 0);
  const importe = impTotal || asignado;
  if (Math.abs(importe - asignado) > 1) { alert("El total asignado en las formas de pago (" + fmt(asignado) + ") no coincide con el importe (" + fmt(importe) + ")."); return; }
  // estado: pendiente si hay alguna parte en ctacte; si todo lo demás está pago, queda 'pagado' salvo que tenga ctacte
  const tieneCtaCte = pagosTemp.some(p => p.forma === "ctacte");
  const facTipoEl = document.getElementById("g_factipo");
  const facNroEl = document.getElementById("g_facnro");
  const g = {
    fecha: document.getElementById("g_fecha").value, tipo,
    proveedor: proveedor,
    facturaTipo: facTipoEl ? facTipoEl.value : "",
    facturaNro: facNroEl ? facNroEl.value.trim() : "",
    concepto: document.getElementById("g_conc").value.trim(),
    proyecto: document.getElementById("g_proy").value,
    importe,
    pagos: pagosTemp.map(p => ({ ...p })),
    estado: tieneCtaCte ? "pendiente" : "pagado",
    montoPendiente: pagosTemp.filter(p => p.forma === "ctacte").reduce((a, p) => a + p.importe, 0),
  };
  const socEl = document.getElementById("g_socio");
  if (tipo === "Retiros" && socEl) g.socio = socEl.value;
  // ficha del bien de uso
  if (tipo === "Bienes de Uso") {
    // permitir agregar el bien que quedó tipeado sin haber tocado "+ Agregar"
    const pend = document.getElementById("gb_desc");
    if (pend && pend.value.trim()) addBienTemp();
    if (bienesTemp.length === 0) { alert("Agregá al menos un bien a la factura (ej: hormigonera, camioneta, andamios)."); return; }
    g.bienes = bienesTemp.map(b => ({ ...b }));
    g.bien = undefined;   // modelo viejo: queda reemplazado por la lista
  } else {
    g.bienes = undefined;
    g.bien = undefined;
  }
  if (window._editGastoId) {
    // borrar cheques viejos de este gasto y actualizar
    const dd = DB.get();
    dd.cheques = dd.cheques.filter(c => c.refGasto !== window._editGastoId);
    DB.save();
    DB.update("gastos", window._editGastoId, g);
    const upd = DB.get().gastos.find(x => x.id === window._editGastoId);
    generarCheques(upd);
    window._editGastoId = null;
  } else {
    const saved = DB.add("gastos", g);
    generarCheques(saved);
  }
  pagosTemp = []; chequesTemp = []; bienesTemp = [];
  window._formaPagoInicial = null;
  closeModal(); render();
}
// Saldar la parte pendiente (cta cte) de un gasto
function openSaldarModal(id) {
  const g = DB.get().gastos.find(x => x.id === id); if (!g) return;
  const pendiente = (g.pagos && g.pagos.length) ? (g.montoPendiente || 0) : g.importe;
  window._saldarImporte = pendiente; chequesTemp = [];
  modalHTML(`
    <p class="muted" style="font-size:13px;margin-bottom:14px">Saldar la parte pendiente de <b>${esc(g.proveedor)}</b> — ${fmt(pendiente)}. ¿Con qué pagás?</p>
    <div class="field"><label class="field-lbl">Forma de pago</label><select id="s_forma" onchange="sFormaChange()">
      <option value="efectivo">Efectivo (caja)</option><option value="cajachica">Caja chica</option><option value="transferencia">Transferencia (banco)</option><option value="echeque">E-cheque(s)</option></select></div>
    <div class="field"><label class="field-lbl">Fecha de pago</label><input id="s_fecha" type="date" value="${today()}"></div>
    <div id="s_extra"></div>
  `, "Saldar gasto", "confirmSaldar('" + id + "')");
  sFormaChange();
}
function sFormaChange() {
  const f = document.getElementById("s_forma").value;
  const ex = document.getElementById("s_extra");
  if (f === "echeque") { chequesTemp = []; ex.innerHTML = chequesPanelHTML("s"); renderChequesTemp("s"); }
  else ex.innerHTML = "";
}
function confirmSaldar(id) {
  const g = DB.get().gastos.find(x => x.id === id); if (!g) return;
  const forma = document.getElementById("s_forma").value;
  const pendiente = (g.pagos && g.pagos.length) ? (g.montoPendiente || 0) : g.importe;
  // construir la nueva línea de pago que reemplaza la parte ctacte
  let nuevaLinea = { forma, importe: pendiente };
  if (forma === "echeque") {
    if (chequesTemp.length === 0) { alert("Agregá al menos un e-cheque."); return; }
    nuevaLinea.cheques = chequesTemp.map(c => ({ ...c }));
    nuevaLinea.importe = chequesTemp.reduce((a, c) => a + c.importe, 0);
  }
  // reemplazar líneas ctacte por la nueva forma
  let pagos = (g.pagos && g.pagos.length) ? g.pagos.filter(p => p.forma !== "ctacte") : [];
  pagos.push(nuevaLinea);
  DB.update("gastos", id, { pagos, estado: "pagado", montoPendiente: 0, forma: undefined, cheques: undefined });
  generarCheques(DB.get().gastos.find(x => x.id === id));
  chequesTemp = []; closeModal(); render();
}

      ${impRef ? `<span style="color:${Math.abs(difer) < 1 ? 'var(--success)' : 'var(--warning)'}">${Math.abs(difer) < 1 ? '✓ coincide' : 'dif: ' + fmt(difer)}</span>` : ""}
    </div>`;
}

// ════════════════════════════════════════════════════════════════════════
// VISTA: CAJA (conciliada, con saldo arrastrado fila por fila)
// ════════════════════════════════════════════════════════════════════════
function viewCaja() {
  const d = DB.get();
  const filas = [];
  d.ingresos.forEach(i => {
    if (i.cobros && i.cobros.length) { const ef = i.cobros.filter(c => c.forma === "efectivo").reduce((a, c) => a + c.importe, 0); if (ef > 0) filas.push({ fecha: i.fecha, concepto: i.tipo + (i.cliente ? " · " + i.cliente : ""), detalle: i.detalle, tipo: "ingreso", importe: ef }); }
    else if (i.destino === "caja") filas.push({ fecha: i.fecha, concepto: i.tipo + (i.socio ? " · " + i.socio.split(" ")[0] : ""), detalle: i.detalle, tipo: "ingreso", importe: i.importe });
  });
  d.gastos.forEach(g => { const ef = montoPorForma(g, "efectivo"); if (ef > 0) filas.push({ fecha: g.fecha, concepto: g.tipo, detalle: [g.concepto, g.proveedor].filter(Boolean).join(" · "), tipo: "egreso", importe: ef }); });
  (d.ajustesCaja || []).forEach(a => filas.push({ fecha: a.fecha, concepto: "Ajuste manual", detalle: a.detalle, tipo: a.importe >= 0 ? "ingreso" : "egreso", importe: Math.abs(a.importe), ajusteId: a.id }));
  // salidas de la caja general hacia la caja chica
  (d.transfCajaChica || []).forEach(t => { if (t.origen === "caja") filas.push({ fecha: t.fecha, concepto: "→ Pase a Caja Chica", detalle: [t.detalle, t.responsable ? "→ " + t.responsable : ""].filter(Boolean).join(" · "), tipo: "egreso", importe: t.importe, transfId: t.id }); });
  // del movimiento más viejo al más nuevo, arrastrando el saldo fila por fila
  filas.sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
  let acum = d.saldoInicialCaja || 0;
  filas.forEach(f => { acum += (f.tipo === "ingreso" ? f.importe : -f.importe); f.saldo = acum; });
  const saldo = saldoCaja();
  const ing = filas.filter(f => f.tipo === "ingreso").reduce((a, f) => a + f.importe, 0);
  const egr = filas.filter(f => f.tipo === "egreso").reduce((a, f) => a + f.importe, 0);
  return `
    <div class="toolbar"><div><h2>Caja en efectivo</h2><div class="sub">Del movimiento más viejo al más nuevo — la columna Saldo arrastra el acumulado fila por fila.</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="openTransfCC()">→ Pasar a caja chica</button><button class="btn-ghost btn" onclick="setSaldoInicialCaja()">Saldo inicial</button><button class="btn-ghost btn" onclick="openAjusteCaja()">+ Ajuste</button></div></div>
    <div class="stats">
      <div class="stat"><div class="lbl">Saldo en caja</div><div class="val" style="color:${saldo >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmt(saldo)}</div><div class="sub">inicial: ${fmt(d.saldoInicialCaja || 0)}</div></div>
      <div class="stat"><div class="lbl">Entradas</div><div class="val" style="color:var(--success)">${fmt(ing)}</div></div>
      <div class="stat"><div class="lbl">Salidas</div><div class="val" style="color:var(--danger)">${fmt(egr)}</div></div>
    </div>
    <div class="panel" style="overflow:hidden">
      ${filas.length === 0 ? `<div class="empty">Sin movimientos de caja. Se cargan desde Ingresos y Gastos.</div>` :
      `<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Detalle</th><th class="num">Entrada</th><th class="num">Salida</th><th class="num">Saldo</th><th></th></tr></thead><tbody>
      <tr><td class="muted">—</td><td style="font-weight:600">Saldo inicial</td><td class="muted">—</td><td class="num muted">—</td><td class="num muted">—</td><td class="num" style="font-weight:700">${fmt(d.saldoInicialCaja || 0)}</td><td></td></tr>
      ${filas.map(f => `<tr>
        <td style="white-space:nowrap">${fmtF(f.fecha)}</td><td>${esc(f.concepto)}</td><td class="muted">${esc(f.detalle) || "—"}</td>
        <td class="num" style="color:var(--success)">${f.tipo === "ingreso" ? "+" + fmt(f.importe) : "—"}</td>
        <td class="num" style="color:var(--danger)">${f.tipo === "egreso" ? "−" + fmt(f.importe) : "—"}</td>
        <td class="num" style="font-weight:700;color:${f.saldo >= 0 ? 'var(--text)' : 'var(--danger)'}">${fmt(f.saldo)}</td>
        <td>${f.ajusteId ? `<button class="btn-danger btn btn-sm" onclick="DB.remove('ajustesCaja','${f.ajusteId}');render()">×</button>`
            : f.transfId ? `<div style="display:flex;gap:6px"><button class="btn-ghost btn btn-sm" onclick="openTransfCC('${f.transfId}')">✎</button><button class="btn-danger btn btn-sm" onclick="delTransfCC('${f.transfId}')">×</button></div>`
            : `<span class="muted" style="font-size:11px">auto</span>`}</td>
      </tr>`).join("")}
      </tbody><tfoot><tr><td colspan="5" style="font-weight:700;color:var(--accent)">SALDO FINAL</td><td class="num" style="font-weight:700;color:${saldo >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmt(saldo)}</td><td></td></tr></tfoot></table></div>`}
    </div>`;
}
function setSaldoInicialCaja() {
  modalHTML(`<div class="field"><label class="field-lbl">Saldo inicial de caja ($)</label><input id="sic_monto" type="number" value="${DB.get().saldoInicialCaja || 0}"></div>`, "Saldo inicial de caja", "saveSaldoInicialCaja()");
}
function saveSaldoInicialCaja() { DB.setMeta("saldoInicialCaja", parseFloat(document.getElementById("sic_monto").value || 0)); closeModal(); render(); }
function openAjusteCaja() {
  modalHTML(`<p class="muted" style="font-size:13px;margin-bottom:14px">Ajuste de conciliación: poné un monto positivo (sobra plata) o negativo (falta).</p>
    <div class="grid2"><div class="field"><label class="field-lbl">Fecha</label><input id="aj_fecha" type="date" value="${today()}"></div>
    <div class="field"><label class="field-lbl">Importe (+/−)</label><input id="aj_imp" type="number" placeholder="ej: -500 o 500"></div></div>
    <div class="field"><label class="field-lbl">Detalle</label><input id="aj_det" placeholder="Motivo del ajuste"></div>`, "Ajuste de caja", "saveAjuste()");

function saveAjuste() { const imp = parseFloat(document.getElementById("aj_imp").value || 0); if (!imp) return; DB.add("ajustesCaja", { fecha: document.getElementById("aj_fecha").value, importe: imp, detalle: document.getElementById("aj_det").value.trim() }); closeModal(); render(); }

// ════════════════════════════════════════════════════════════════════════
// VISTA: CAJA CHICA
// Se fondea con transferencias desde la caja general o desde el banco (efectivo
// o transferencia a la cuenta del responsable). Se gasta registrando egresos con
// forma de pago "Caja chica".
// ════════════════════════════════════════════════════════════════════════
function viewCajaChica() {
  const d = DB.get();
  const filas = [];
  (d.transfCajaChica || []).forEach(t => filas.push({
    fecha: t.fecha, concepto: t.origen === "banco" ? "Ingreso desde Banco" : "Ingreso desde Caja general",
    detalle: [t.detalle, t.responsable ? "→ " + t.responsable : ""].filter(Boolean).join(" · "),
    tipo: "ingreso", importe: t.importe, transfId: t.id
  }));
  d.gastos.forEach(g => {
    const cc = montoPorForma(g, "cajachica");
    if (cc > 0) filas.push({ fecha: g.fecha, concepto: g.tipo,
      detalle: [g.concepto, g.proveedor, (g.facturaTipo || g.facturaNro) ? "Fc " + (g.facturaTipo || "") + " " + (g.facturaNro || "") : ""].filter(Boolean).join(" · "),
      tipo: "egreso", importe: cc, gastoId: g.id, parcial: cc < g.importe ? g.importe : 0 });
  });
  (d.ajustesCajaChica || []).forEach(a => filas.push({
    fecha: a.fecha, concepto: "Ajuste manual", detalle: a.detalle,
    tipo: a.importe >= 0 ? "ingreso" : "egreso", importe: Math.abs(a.importe), ajusteId: a.id
  }));
  // del más viejo al más nuevo, arrastrando saldo
  filas.sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
  let acum = d.saldoInicialCajaChica || 0;
  filas.forEach(f => { acum += (f.tipo === "ingreso" ? f.importe : -f.importe); f.saldo = acum; });
  const saldo = saldoCajaChica();
  const ing = filas.filter(f => f.tipo === "ingreso").reduce((a, f) => a + f.importe, 0);
  const egr = filas.filter(f => f.tipo === "egreso").reduce((a, f) => a + f.importe, 0);
  const desdeCaja = (d.transfCajaChica || []).filter(t => t.origen === "caja").reduce((a, t) => a + t.importe, 0);
  const desdeBanco = (d.transfCajaChica || []).filter(t => t.origen === "banco").reduce((a, t) => a + t.importe, 0);
  const resp = d.responsableCajaChica || "";
  return `
    <div class="toolbar"><div><h2>Caja chica</h2><div class="sub">Fondos que se pasan desde la caja general o el banco${resp ? " a " + esc(resp) : ""}. Cargá las facturas acá igual que en Egresos: quedan en las dos pestañas.</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="openTransfCC()">+ Ingresar fondos</button>
        <button class="btn" onclick="openGastoCC()">+ Cargar factura / gasto</button>
        <button class="btn-ghost btn" onclick="setSaldoInicialCC()">Saldo inicial</button>
        <button class="btn-ghost btn" onclick="openAjusteCC()">+ Ajuste</button>
      </div></div>
    <div class="stats">
      <div class="stat"><div class="lbl">Saldo caja chica</div><div class="val" style="color:${saldo >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmt(saldo)}</div><div class="sub">inicial: ${fmt(d.saldoInicialCajaChica || 0)}</div></div>
      <div class="stat"><div class="lbl">Ingresado desde caja</div><div class="val">${fmt(desdeCaja)}</div><div class="sub">efectivo</div></div>
      <div class="stat"><div class="lbl">Ingresado desde banco</div><div class="val">${fmt(desdeBanco)}</div><div class="sub">transferencia</div></div>
      <div class="stat"><div class="lbl">Gastado</div><div class="val" style="color:var(--danger)">${fmt(egr)}</div><div class="sub">${filas.filter(f => f.gastoId).length} egresos</div></div>
    </div>
    <div class="panel" style="overflow:hidden">
      ${filas.length === 0 ? `<div class="empty">Todavía no hay movimientos. Empezá pasando fondos desde la caja general o el banco con "+ Ingresar fondos".</div>` :
      `<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Detalle</th><th class="num">Entrada</th><th class="num">Salida</th><th class="num">Saldo</th><th></th></tr></thead><tbody>
      <tr><td class="muted">—</td><td style="font-weight:600">Saldo inicial</td><td class="muted">—</td><td class="num muted">—</td><td class="num muted">—</td><td class="num" style="font-weight:700">${fmt(d.saldoInicialCajaChica || 0)}</td><td></td></tr>
      ${filas.map(f => `<tr>
        <td style="white-space:nowrap">${fmtF(f.fecha)}</td>
        <td>${esc(f.concepto)}</td>
        <td class="muted">${esc(f.detalle) || "—"}${f.parcial ? `<div class="muted" style="font-size:11px">parte de una factura de ${fmt(f.parcial)}</div>` : ""}</td>
        <td class="num" style="color:var(--success)">${f.tipo === "ingreso" ? "+" + fmt(f.importe) : "—"}</td>
        <td class="num" style="color:var(--danger)">${f.tipo === "egreso" ? "−" + fmt(f.importe) : "—"}</td>
        <td class="num" style="font-weight:600;color:${f.saldo >= 0 ? 'var(--text)' : 'var(--danger)'}">${fmt(f.saldo)}</td>
        <td>${f.transfId ? `<div style="display:flex;gap:6px"><button class="btn-ghost btn btn-sm" onclick="openTransfCC('${f.transfId}')">✎</button><button class="btn-danger btn btn-sm" onclick="delTransfCC('${f.transfId}')">×</button></div>`
            : f.ajusteId ? `<button class="btn-danger btn btn-sm" onclick="DB.remove('ajustesCajaChica','${f.ajusteId}');render()">×</button>`
            : f.gastoId ? `<div style="display:flex;gap:6px"><button class="btn-ghost btn btn-sm" onclick="openGastoModal('${f.gastoId}')" title="Editar la factura">✎</button><button class="btn-danger btn btn-sm" onclick="if(confirm('¿Eliminar esta factura? Se borra también de Egresos.')){DB.remove('gastos','${f.gastoId}');render()}">×</button></div>`
            : `<span class="muted" style="font-size:11px">auto</span>`}</td>
      </tr>`).join("")}
      </tbody><tfoot><tr><td colspan="3" style="font-weight:700;color:var(--accent)">TOTALES</td>
        <td class="num" style="font-weight:700;color:var(--success)">${fmt(ing)}</td>
        <td class="num" style="font-weight:700;color:var(--danger)">${fmt(egr)}</td>
        <td class="num" style="font-weight:700">${fmt(saldo)}</td><td></td></tr></tfoot></table></div>`}
    </div>`;
}
// Ingresar fondos a la caja chica desde la caja general o desde el banco
function openTransfCC(editId) {
  const d = DB.get();
  const t = editId ? (d.transfCajaChica || []).find(x => x.id === editId) : null;
  window._editTransfCC = editId || null;
  modalHTML(`
    <p class="muted" style="font-size:13px;margin-bottom:14px">Pasaje de fondos a la caja chica. Si sale de la <b>caja general</b> se descuenta del saldo de Caja. Si sale del <b>banco</b>, acordate de reflejarlo también en el saldo real del banco.</p>
    <div class="grid2">
      <div class="field"><label class="field-lbl">Fecha</label><input id="tc_fecha" type="date" value="${t ? t.fecha : today()}"></div>
      <div class="field"><label class="field-lbl">Importe ($)</label><input id="tc_imp" type="number" placeholder="0" value="${t ? t.importe : ""}"></div>
    </div>
    <div class="field"><label class="field-lbl">¿De dónde sale?</label><select id="tc_origen">
      <option value="caja" ${t && t.origen === "caja" ? "selected" : ""}>Caja general (efectivo)</option>
      <option value="banco" ${t && t.origen === "banco" ? "selected" : ""}>Banco (transferencia)</option>
    </select></div>
    <div class="field"><label class="field-lbl">Responsable que recibe</label><input id="tc_resp" placeholder="Quién maneja la caja chica" value="${t ? esc(t.responsable || "") : esc(d.responsableCajaChica || "")}"></div>
    <div class="field"><label class="field-lbl">Detalle / nota</label><input id="tc_det" placeholder="Opcional" value="${t ? esc(t.detalle || "") : ""}"></div>
  `, editId ? "Editar ingreso de fondos" : "Ingresar fondos a caja chica", "saveTransfCC()");
}
function saveTransfCC() {
  const imp = parseFloat(document.getElementById("tc_imp").value || 0);
  if (!imp || imp <= 0) { alert("Poné un importe mayor a cero."); return; }
  const o = {
    fecha: document.getElementById("tc_fecha").value,
    importe: imp,
    origen: document.getElementById("tc_origen").value,
    responsable: document.getElementById("tc_resp").value.trim(),
    detalle: document.getElementById("tc_det").value.trim(),
  };
  transfsCC();
  if (o.responsable) DB.get().responsableCajaChica = o.responsable;
  if (window._editTransfCC) { DB.update("transfCajaChica", window._editTransfCC, o); window._editTransfCC = null; }
  else DB.add("transfCajaChica", o);
  closeModal(); render();
}
function delTransfCC(id) {
  if (!confirm("¿Eliminar este ingreso de fondos a la caja chica?")) return;
  DB.remove("transfCajaChica", id); render();
}
function setSaldoInicialCC() {
  modalHTML(`<div class="field"><label class="field-lbl">Saldo inicial de caja chica ($)</label><input id="sicc_monto" type="number" value="${DB.get().saldoInicialCajaChica || 0}"></div>`, "Saldo inicial de caja chica", "saveSaldoInicialCC()");
}
function saveSaldoInicialCC() { DB.setMeta("saldoInicialCajaChica", parseFloat(document.getElementById("sicc_monto").value || 0)); closeModal(); render(); }
function openAjusteCC() {
  modalHTML(`<p class="muted" style="font-size:13px;margin-bottom:14px">Ajuste de arqueo de la caja chica: positivo si sobra plata, negativo si falta.</p>
    <div class="grid2"><div class="field"><label class="field-lbl">Fecha</label><input id="ajcc_fecha" type="date" value="${today()}"></div>
    <div class="field"><label class="field-lbl">Importe (+/−)</label><input id="ajcc_imp" type="number" placeholder="ej: -500 o 500"></div></div>
    <div class="field"><label class="field-lbl">Detalle</label><input id="ajcc_det" placeholder="Motivo del ajuste"></div>`, "Ajuste de caja chica", "saveAjusteCC()");
}
function saveAjusteCC() {
  const imp = parseFloat(document.getElementById("ajcc_imp").value || 0); if (!imp) return;
  ajustesCC();
  DB.add("ajustesCajaChica", { fecha: document.getElementById("ajcc_fecha").value, importe: imp, detalle: document.getElementById("ajcc_det").value.trim() });

// atajo: abre el formulario de egreso con la forma de pago "Caja chica" ya elegida

}

// VISTA: E-CHEQUES (incluye saldo del banco)
// ════════════════════════════════════════════════════════════════════════
function setSaldoBanco() {
  const d = DB.get();
  modalHTML(`
    <p class="muted" style="font-size:13px;margin-bottom:14px">Cargá el saldo que ves en el homebanking de Credicoop. Este número es la verdad del banco — la proyección de e-cheques se calcula sobre él.</p>

      <div class="field"><label class="field-lbl">Saldo real ($)</label><input id="sb_monto" type="number" value="${d.saldoBancoManual || 0}"></div>
      <div class="field"><label class="field-lbl">Fecha del saldo</label><input id="sb_fecha" type="date" value="${d.saldoBancoFecha || today()}"></div>
    </div>
  `, "Actualizar saldo del banco", "saveSaldoBanco()");
}
function saveSaldoBanco() {
  const v = parseFloat(document.getElementById("sb_monto").value || 0);
  DB.setMeta("saldoBancoManual", v);
  DB.setMeta("saldoBancoFecha", document.getElementById("sb_fecha").value || today());
  closeModal(); render();
}
function viewCheques() {
  const d = DB.get();
  const emitidos = d.cheques.filter(c => !chequeEsRecibido(c)).sort((a, b) => (a.fechaPago || "").localeCompare(b.fechaPago || ""));
  const recibidos = d.cheques.filter(c => chequeEsRecibido(c)).sort((a, b) => (a.fechaPago || "").localeCompare(b.fechaPago || ""));
  const totalEmit = totalEmitidosPend(), totalReci = totalRecibidosPend();
  const real = saldoBanco(), proy = saldoBancoProyectado();
  const proyeccion = proyeccionBanco();
  const cubre = proy >= 0;
  let alerta = "";
  if (totalEmit > 0 || totalReci > 0) alerta = cubre
    ? `<div class="alert alert-ok"><b style="color:var(--success)">✓ Cubierto:</b> con saldo real ${fmt(real)}, menos ${fmt(totalEmit)} en cheques propios pendientes y más ${fmt(totalReci)} por acreditar, el proyectado es ${fmt(proy)}.</div>`
    : `<div class="alert alert-warn"><b style="color:var(--warning)">⚠ Necesitás cubrir ${fmt(Math.abs(proy))}:</b> el saldo proyectado queda negativo tras los movimientos de cheques.</div>`;

  const tablaCheques = (lista, esRecibido) => lista.length === 0
    ? `<div class="empty">No hay cheques ${esRecibido ? "recibidos" : "emitidos"}.</div>`
    : `<div style="overflow-x:auto"><table><thead><tr><th>${esRecibido ? "Acreditado" : "Pagado"}</th><th>Pago (vto)</th><th>Nro.</th><th>${esRecibido ? "Cliente" : "Beneficiario"}</th><th class="num">Importe</th><th>Estado</th></tr></thead><tbody>
      ${lista.map(c => `<tr style="${c.estado === "debitado" ? "opacity:.5" : ""}">
        <td><span class="check-pend ${c.estado === "debitado" ? "done" : ""}" onclick="toggleCheque('${c.id}')" title="Marcar como ${esRecibido ? "acreditado" : "pagado"}">${c.estado === "debitado" ? "✓" : ""}</span></td>
        <td style="white-space:nowrap;font-weight:600">${fmtF(c.fechaPago)}</td>
        <td class="muted" style="font-family:monospace">${esc(c.nro) || "—"}</td><td>${esc(c.beneficiario)}</td>
        <td class="num" style="font-weight:600;color:${esRecibido ? 'var(--success)' : 'var(--danger)'}">${esRecibido ? "+" : "−"}${fmt(c.importe)}</td>
        <td>${c.estado === "pendiente" ? `<span class="badge" style="background:var(--warning)22;color:var(--warning)">Pendiente</span>` : `<span class="badge" style="background:var(--muted)22;color:var(--muted)">${esRecibido ? "Acreditado" : "Pagado"}</span>`}</td>
      </tr>`).join("")}
      </tbody></table></div>`;

  return `
    <div class="toolbar"><div><h2>Cheques y saldo del banco</h2><div class="sub">Saldo real + cheques propios (salen) y recibidos (entran). Tildá cada uno cuando se debita o acredita.</div></div>
      <button class="btn" onclick="setSaldoBanco()">Actualizar saldo real</button></div>
    ${alerta}
    <div class="stats" style="margin-bottom:20px">
      <div class="stat"><div class="lbl">Saldo real banco</div><div class="val">${fmt(real)}</div><div class="sub">${d.saldoBancoFecha ? "al " + fmtF(d.saldoBancoFecha) : "sin cargar"}</div></div>
      <div class="stat"><div class="lbl">Propios pendientes</div><div class="val" style="color:var(--danger)">−${fmt(totalEmit)}</div><div class="sub">${chequesEmitidosPend().length} cheques salen</div></div>
      <div class="stat"><div class="lbl">Recibidos pendientes</div><div class="val" style="color:var(--success)">+${fmt(totalReci)}</div><div class="sub">${chequesRecibidosPend().length} cheques entran</div></div>
      <div class="stat"><div class="lbl">Saldo proyectado</div><div class="val" style="color:${proy >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmt(proy)}</div><div class="sub">real − propios + recibidos</div></div>
    </div>

    <div class="panel" style="overflow:hidden;margin-bottom:20px">
      <div style="padding:13px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px">Proyección por fecha</div>
      ${proyeccion.length === 0 ? `<div class="empty">No hay cheques pendientes para proyectar.</div>` :
      `<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Cheques</th><th class="num">Neto del día</th><th class="num">Saldo antes</th><th class="num">Saldo después</th><th class="num">A cubrir</th></tr></thead><tbody>
      ${proyeccion.map(p => `<tr style="${p.saldoDespues < 0 ? 'background:#2a1c1c' : ''}">
        <td style="white-space:nowrap;font-weight:600">${fmtF(p.fecha)}</td>
        <td class="muted" style="font-size:12px">${p.items.map(c => (chequeEsRecibido(c) ? "↓ " : "↑ ") + (c.nro || "s/n") + " · " + fmt(c.importe)).join("<br>")}</td>
        <td class="num" style="color:${p.totalDia >= 0 ? 'var(--success)' : 'var(--danger)'}">${p.totalDia >= 0 ? "+" : "−"}${fmt(Math.abs(p.totalDia))}</td>
        <td class="num muted">${fmt(p.saldoAntes)}</td>
        <td class="num" style="font-weight:700;color:${p.saldoDespues >= 0 ? 'var(--text)' : 'var(--danger)'}">${fmt(p.saldoDespues)}</td>
        <td class="num" style="font-weight:700;color:${p.cubrir > 0 ? 'var(--danger)' : 'var(--muted)'}">${p.cubrir > 0 ? fmt(p.cubrir) : "—"}</td>
      </tr>`).join("")}
      </tbody></table></div>`}
    </div>

    <div class="panel" style="overflow:hidden;margin-bottom:20px">
      <div style="padding:13px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px">Cheques propios emitidos <span class="muted" style="font-weight:400">(salen de tu banco)</span></div>
      ${tablaCheques(emitidos, false)}
    </div>
    <div class="panel" style="overflow:hidden">
      <div style="padding:13px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px">Cheques recibidos <span class="muted" style="font-weight:400">(entran a tu banco)</span></div>
      ${tablaCheques(recibidos, true)}
    </div>`;
}
function toggleCheque(id) {
  const c = DB.get().cheques.find(x => x.id === id); if (!c) return;
  DB.update("cheques", id, { estado: c.estado === "pendiente" ? "debitado" : "pendiente" });
  render();
}

// ════════════════════════════════════════════════════════════════════════
// VISTA: PROVEEDORES (cuenta por proveedor: total facturado + saldo a pagar)
// ════════════════════════════════════════════════════════════════════════
// filtros de la pestaña Proveedores
let _fProv = { nombre: "", cuenta: "", estado: "todos", texto: "", desde: "", hasta: "" };
function setFProv(k, v) { _fProv[k] = v; renderTabContent(); }
function limpiarFProv() { _fProv = { nombre: "", cuenta: "", estado: "todos", texto: "", desde: "", hasta: "" }; renderTabContent(); }
function viewProveedores() {
  const d = DB.get();
  // agrupar por proveedor: entra CUALQUIER egreso con proveedor cargado, sea la cuenta
  // que sea (Honorarios, Mano de Obra, Gastos varios, Bienes de Uso, Proveedores...),
  // más los egresos sin proveedor que tengan saldo pendiente.
  const nombresProv = new Set(nombresLista(listaProveedores()));
  const porProv = {};
  d.gastos.forEach(g => {
    const prov = (g.proveedor || "").trim();
    // registros viejos auto-rellenaban proveedor con el nombre de la cuenta: no son proveedores reales
    const esAutoViejo = prov && prov === g.tipo && !nombresProv.has(prov);
    const tieneProv = prov && !esAutoViejo;
    if (!tieneProv && pendienteDe(g) <= 0) return;
    const k = tieneProv ? prov : "Sin proveedor asignado";
    (porProv[k] = porProv[k] || []).push(g);
  });
  // nombres de todos los proveedores con movimientos (para el desplegable del filtro)
  const todosLosNombres = Object.keys(porProv).sort((a, b) => a.localeCompare(b));
  // cuentas presentes en los movimientos
  const todasLasCuentas = [...new Set(Object.values(porProv).flat().map(g => g.tipo))].sort();
  const txt = _fProv.texto.trim().toLowerCase();
  const pasaFiltro = g => {
    if (_fProv.cuenta && g.tipo !== _fProv.cuenta) return false;
    if (_fProv.estado === "pendientes" && pendienteDe(g) <= 0) return false;
    if (_fProv.estado === "pagados" && pendienteDe(g) > 0) return false;
    if (_fProv.desde && (g.fecha || "") < _fProv.desde) return false;
    if (_fProv.hasta && (g.fecha || "") > _fProv.hasta) return false;
    if (txt) {
      const campos = [g.concepto, g.proveedor, g.facturaNro, g.proyecto, g.bien && g.bien.descripcion].filter(Boolean).join(" ").toLowerCase();
      if (!campos.includes(txt)) return false;
    }
    return true;
  };
  let provs = Object.keys(porProv)
    .filter(nombre => !_fProv.nombre || nombre === _fProv.nombre)
    .map(nombre => {
      const items = porProv[nombre].filter(pasaFiltro).sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
      return { nombre, items, total: items.reduce((a, g) => a + g.importe, 0), pendiente: items.reduce((a, g) => a + pendienteDe(g), 0) };
    })
    .filter(p => p.items.length > 0)
    .sort((a, b) => b.pendiente - a.pendiente || b.total - a.total);
  const hayFiltro = !!(_fProv.nombre || _fProv.cuenta || _fProv.texto || _fProv.desde || _fProv.hasta || _fProv.estado !== "todos");
  // los totales de arriba acompañan al filtro
  const totalDeuda = hayFiltro ? provs.reduce((a, p) => a + p.pendiente, 0) : deudaProveedores();
  const totalFact = provs.reduce((a, p) => a + p.total, 0);
  const conDeuda = provs.filter(p => p.pendiente > 0).length;
  const factPend = provs.reduce((a, p) => a + p.items.filter(g => pendienteDe(g) > 0).length, 0);
  const filtros = `
    <div class="panel" style="padding:14px 16px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Filtros</div>
        ${hayFiltro ? `<button class="btn-ghost btn btn-sm" onclick="limpiarFProv()">✕ Limpiar filtros</button>` : ""}
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
        <div class="field" style="margin:0"><label class="field-lbl">Proveedor</label>
          <select onchange="setFProv('nombre',this.value)">
            <option value="">Todos (${todosLosNombres.length})</option>
            ${todosLosNombres.map(n => `<option ${_fProv.nombre === n ? "selected" : ""}>${esc(n)}</option>`).join("")}
          </select></div>
        <div class="field" style="margin:0"><label class="field-lbl">Cuenta</label>
          <select onchange="setFProv('cuenta',this.value)">
            <option value="">Todas</option>
            ${todasLasCuentas.map(c => `<option ${_fProv.cuenta === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
          </select></div>
        <div class="field" style="margin:0"><label class="field-lbl">Estado</label>
          <select onchange="setFProv('estado',this.value)">
            <option value="todos" ${_fProv.estado === "todos" ? "selected" : ""}>Todos</option>
            <option value="pendientes" ${_fProv.estado === "pendientes" ? "selected" : ""}>Solo con deuda</option>
            <option value="pagados" ${_fProv.estado === "pagados" ? "selected" : ""}>Solo pagados</option>
          </select></div>
        <div class="field" style="margin:0"><label class="field-lbl">Desde</label><input type="date" value="${_fProv.desde}" onchange="setFProv('desde',this.value)"></div>
        <div class="field" style="margin:0"><label class="field-lbl">Hasta</label><input type="date" value="${_fProv.hasta}" onchange="setFProv('hasta',this.value)"></div>
        <div class="field" style="margin:0"><label class="field-lbl">Buscar</label><input id="fprov_txt" placeholder="Concepto, factura, obra..." value="${esc(_fProv.texto)}" onchange="setFProv('texto',this.value)"></div>
      </div>
    </div>`;
  return `
    <div class="toolbar"><div><h2>Proveedores</h2><div class="sub">Cuenta de cada proveedor: total facturado y saldo a pagar en cuenta corriente. Los pendientes se saldan desde acá o desde Egresos.</div></div></div>
    ${filtros}
    <div class="stats">
      <div class="stat"><div class="lbl">Deuda ${hayFiltro ? "(filtrada)" : "total (cta cte)"}</div><div class="val" style="color:${totalDeuda > 0 ? 'var(--warning)' : 'var(--muted)'}">${fmt(totalDeuda)}</div><div class="sub">${conDeuda} proveedores con deuda</div></div>
      <div class="stat"><div class="lbl">Total facturado</div><div class="val">${fmt(totalFact)}</div><div class="sub">${hayFiltro ? "según filtros" : "histórico"}</div></div>
      <div class="stat"><div class="lbl">Facturas pendientes</div><div class="val">${factPend}</div></div>
      <div class="stat"><div class="lbl">Proveedores ${hayFiltro ? "en el filtro" : "con cuenta"}</div><div class="val">${provs.length}</div></div>
    </div>
    ${provs.length === 0 ? `<div class="panel"><div class="empty">${hayFiltro ? "Ningún movimiento coincide con los filtros.<br><button class='btn-ghost btn btn-sm' style='margin-top:12px' onclick='limpiarFProv()'>Limpiar filtros</button>" : "Todavía no hay movimientos de proveedores."}</div></div>` :
    provs.map(p => `<div class="panel" style="overflow:hidden;margin-bottom:14px">
      <div style="padding:13px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="font-weight:700">${esc(p.nombre)}</span>
        <span style="display:flex;gap:18px;font-size:13px;align-items:center">
          <span class="muted">Total facturado: <b style="color:var(--text)">${fmt(p.total)}</b></span>
          <span class="muted">Saldo a pagar: <b style="color:${p.pendiente > 0 ? 'var(--warning)' : 'var(--success)'}">${p.pendiente > 0 ? fmt(p.pendiente) : fmt(0) + " ✓"}</b></span>
        </span>
      </div>
      <div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Cuenta</th><th>Concepto</th><th>C. costo</th><th class="num">Importe</th><th class="num">Pendiente</th><th>Estado</th></tr></thead><tbody>
      ${p.items.map(g => { const pd = pendienteDe(g); return `<tr>
        <td style="white-space:nowrap">${fmtF(g.fecha)}</td>
        <td><span class="badge" style="background:var(--info)22;color:var(--info)">${esc(g.tipo)}</span></td>
        <td class="muted">${esc(g.concepto) || (g.bien ? "🚜 " + esc(g.bien.descripcion) : "—")}${(g.facturaTipo || g.facturaNro) ? `<div class="muted" style="font-size:11px">Fc ${esc(g.facturaTipo)} ${esc(g.facturaNro)}</div>` : ""}</td>
        <td class="muted">${proyectoLabel(g.proyecto)}</td>
        <td class="num" style="font-weight:600">${fmt(g.importe)}</td>
        <td class="num" style="font-weight:600;color:${pd > 0 ? 'var(--warning)' : 'var(--muted)'}">${pd > 0 ? fmt(pd) : "—"}</td>
        <td>${pd > 0 ? `<button class="btn-success btn btn-sm" onclick="openSaldarModal('${g.id}')">Saldar →</button>` : `<span class="badge" style="background:var(--success)22;color:var(--success)">Pagado</span>`}</td>
      </tr>`; }).join("")}
      </tbody><tfoot><tr><td colspan="4" style="font-weight:700">Totales de ${esc(p.nombre)}</td><td class="num" style="font-weight:700">${fmt(p.total)}</td><td class="num" style="font-weight:700;color:${p.pendiente > 0 ? 'var(--warning)' : 'var(--success)'}">${p.pendiente > 0 ? fmt(p.pendiente) : "—"}</td><td></td></tr></tfoot></table></div>
    </div>`).join("")}`;
}

// ════════════════════════════════════════════════════════════════════════
// VISTA: RESUMEN POR CENTRO DE COSTO
// ════════════════════════════════════════════════════════════════════════
// filtros de la pestaña Centros de Costo
let _fCC = { centro: "", desde: "", hasta: "", texto: "" };
function setFCC(k, v) { _fCC[k] = v; renderTabContent(); }
function limpiarFCC() { _fCC = { centro: "", desde: "", hasta: "", texto: "" }; renderTabContent(); }
function toggleCCDetalle(nombre) {
  _ccAbierto = (_ccAbierto === nombre) ? null : nombre;
  renderTabContent();
}
let _ccAbierto = null;

function viewCCosto() {
  const d = DB.get();
  const txt = _fCC.texto.trim().toLowerCase();
  const enRango = m => {
    if (_fCC.desde && (m.fecha || "") < _fCC.desde) return false;
    if (_fCC.hasta && (m.fecha || "") > _fCC.hasta) return false;
    return true;
  };
  const matchTexto = (m, campos) => !txt || campos.filter(Boolean).join(" ").toLowerCase().includes(txt);

  // movimientos filtrados, agrupados por centro de costo
  const acc = {};
  const de = k => { k = k || "General"; if (!acc[k]) acc[k] = { ing: 0, egr: 0, movs: [] }; return acc[k]; };
  d.ingresos.forEach(i => {
    if (!enRango(i)) return;
    if (!matchTexto(i, [i.detalle, i.cliente, i.socio, i.tipo, i.facturaNro])) return;
    const a = de(i.proyecto); a.ing += i.importe;
    a.movs.push({ fecha: i.fecha, clase: "Ingreso", cuenta: i.tipo, quien: i.cliente || i.socio || "—",
      detalle: i.detalle, factura: (i.facturaTipo || i.facturaNro) ? "Fc " + (i.facturaTipo || "") + " " + (i.facturaNro || "") : "",
      importe: i.importe, id: i.id, tipoMov: "ingreso" });
  });
  d.gastos.forEach(g => {
    if (!enRango(g)) return;
    if (!matchTexto(g, [g.concepto, g.proveedor, g.tipo, g.facturaNro, g.bien && g.bien.descripcion])) return;
    const a = de(g.proyecto); a.egr += g.importe;
    a.movs.push({ fecha: g.fecha, clase: "Egreso", cuenta: g.tipo, quien: g.proveedor || g.socio || "—",
      detalle: g.concepto || (g.bien ? g.bien.descripcion : ""), factura: (g.facturaTipo || g.facturaNro) ? "Fc " + (g.facturaTipo || "") + " " + (g.facturaNro || "") : "",
      importe: g.importe, pendiente: pendienteDe(g), id: g.id, tipoMov: "egreso" });
  });
  const hayFiltro = !!(_fCC.centro || _fCC.desde || _fCC.hasta || _fCC.texto);
  if (!hayFiltro) centrosCosto().forEach(c => de(c)); // mostrar todos aunque no tengan movimientos

  let rows = Object.keys(acc)
    .filter(k => !_fCC.centro || k === _fCC.centro)
    .map(k => ({ nombre: k, ing: acc[k].ing, egr: acc[k].egr, res: acc[k].ing - acc[k].egr, movs: acc[k].movs.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "")) }))
    .sort((a, b) => (b.ing + b.egr) - (a.ing + a.egr));
  if (hayFiltro) rows = rows.filter(r => r.movs.length > 0);

  const tIng = rows.reduce((a, r) => a + r.ing, 0), tEgr = rows.reduce((a, r) => a + r.egr, 0);
  const res = tIng - tEgr;
  const todosCentros = [...new Set([...centrosCosto(), ...Object.keys(acc)])].sort((a, b) => a.localeCompare(b));

  const filtros = `
    <div class="panel" style="padding:14px 16px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Filtros</div>
        ${hayFiltro ? `<button class="btn-ghost btn btn-sm" onclick="limpiarFCC()">✕ Limpiar filtros</button>` : ""}
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
        <div class="field" style="margin:0"><label class="field-lbl">Centro de costo</label>
          <select onchange="setFCC('centro',this.value)">
            <option value="">Todos (${todosCentros.length})</option>
            ${todosCentros.map(c => `<option ${_fCC.centro === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
          </select></div>
        <div class="field" style="margin:0"><label class="field-lbl">Desde</label><input type="date" value="${_fCC.desde}" onchange="setFCC('desde',this.value)"></div>
        <div class="field" style="margin:0"><label class="field-lbl">Hasta</label><input type="date" value="${_fCC.hasta}" onchange="setFCC('hasta',this.value)"></div>
        <div class="field" style="margin:0"><label class="field-lbl">Buscar</label><input id="fcc_txt" placeholder="Concepto, proveedor, cliente..." value="${esc(_fCC.texto)}" onchange="setFCC('texto',this.value)"></div>
      </div>
    </div>`;

  // tabla de detalle de un centro
  const detalle = r => {
    if (r.movs.length === 0) return `<div class="empty" style="padding:26px">Este centro de costo todavía no tiene movimientos.</div>`;
    return `<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Cuenta</th><th>Quién</th><th>Detalle</th><th class="num">Ingreso</th><th class="num">Egreso</th><th></th></tr></thead><tbody>
      ${r.movs.map(m => `<tr>
        <td style="white-space:nowrap">${fmtF(m.fecha)}</td>
        <td><span class="badge" style="background:${m.tipoMov === "ingreso" ? "var(--success)" : "var(--danger)"}22;color:${m.tipoMov === "ingreso" ? "var(--success)" : "var(--danger)"}">${m.clase}</span></td>
        <td class="muted">${esc(m.cuenta)}</td>
        <td>${esc(m.quien)}</td>
        <td class="muted">${esc(m.detalle) || "—"}${m.factura ? `<div class="muted" style="font-size:11px">${esc(m.factura)}</div>` : ""}${m.pendiente > 0 ? `<div><span class="badge" style="background:var(--warning)22;color:var(--warning);margin-top:3px">Debe ${fmt(m.pendiente)}</span></div>` : ""}</td>
        <td class="num" style="color:var(--success)">${m.tipoMov === "ingreso" ? "+" + fmt(m.importe) : "—"}</td>
        <td class="num" style="color:var(--danger)">${m.tipoMov === "egreso" ? "−" + fmt(m.importe) : "—"}</td>
        <td><button class="btn-ghost btn btn-sm" onclick="${m.tipoMov === "ingreso" ? `openIngresoModal('${m.id}')` : `openGastoModal('${m.id}')`}">✎</button></td>
      </tr>`).join("")}
      </tbody><tfoot><tr>
        <td colspan="5" style="font-weight:700;color:var(--accent)">TOTALES ${esc(r.nombre)}</td>
        <td class="num" style="font-weight:700;color:var(--success)">+${fmt(r.ing)}</td>
        <td class="num" style="font-weight:700;color:var(--danger)">−${fmt(r.egr)}</td>
        <td></td></tr>
        <tr><td colspan="5" style="font-weight:700">Resultado</td>
        <td colspan="2" class="num" style="font-weight:800;font-size:15px;color:${r.res >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmt(r.res)}</td>
        <td></td></tr></tfoot></table></div>`;
  };

  return `
    <div class="toolbar"><div><h2>Resumen por centro de costo</h2><div class="sub">Ingresos y egresos imputados a cada obra. Tocá una fila para ver el detalle que la compone.</div></div></div>
    ${filtros}
    <div class="stats">
      <div class="stat"><div class="lbl">Ingresos${hayFiltro ? " (filtrados)" : " totales"}</div><div class="val" style="color:var(--success)">${fmt(tIng)}</div></div>
      <div class="stat"><div class="lbl">Egresos${hayFiltro ? " (filtrados)" : " totales"}</div><div class="val" style="color:var(--danger)">${fmt(tEgr)}</div></div>
      <div class="stat"><div class="lbl">Resultado</div><div class="val" style="color:${res >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmt(res)}</div></div>
    </div>
    <div class="panel" style="overflow:hidden;margin-bottom:16px">
      ${rows.length === 0 ? `<div class="empty">${hayFiltro ? "Ningún movimiento coincide con los filtros.<br><button class='btn-ghost btn btn-sm' style='margin-top:12px' onclick='limpiarFCC()'>Limpiar filtros</button>" : "Sin movimientos todavía."}</div>` :
      `<div style="overflow-x:auto"><table><thead><tr><th>Centro de costo</th><th class="num">Movim.</th><th class="num">Ingresos</th><th class="num">Egresos</th><th class="num">Resultado</th><th></th></tr></thead><tbody>
      ${rows.map(r => `<tr onclick="toggleCCDetalle('${esc(r.nombre).replace(/'/g, "\\'")}')" style="cursor:pointer">
        <td style="font-weight:600">${esc(r.nombre)}</td>
        <td class="num muted">${r.movs.length}</td>
        <td class="num" style="color:var(--success)">${r.ing ? "+" + fmt(r.ing) : "—"}</td>
        <td class="num" style="color:var(--danger)">${r.egr ? "−" + fmt(r.egr) : "—"}</td>
        <td class="num" style="font-weight:700;color:${r.res >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmt(r.res)}</td>
        <td class="muted" style="font-size:11px;white-space:nowrap">${_ccAbierto === r.nombre ? "ocultar ▲" : "ver detalle ▼"}</td>
      </tr>`).join("")}

    </div>
    ${_ccAbierto && rows.some(r => r.nombre === _ccAbierto) ? `
      <div class="panel" style="overflow:hidden">
        <div style="padding:13px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">

          <button class="btn-ghost btn btn-sm" onclick="toggleCCDetalle('${esc(_ccAbierto).replace(/'/g, "\\'")}')">✕ Cerrar</button>

        ${detalle(rows.find(r => r.nombre === _ccAbierto))}
      </div>` : ""}`;
}

// VISTA: BIENES DE USO
// ════════════════════════════════════════════════════════════════════════
function viewBienes() {
  const d = DB.get();
  const facturas = d.gastos.filter(g => g.tipo === "Bienes de Uso").sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  // una fila por BIEN, no por factura: una factura puede traer varios
  const items = [];
  facturas.forEach(g => {
    const lista = bienesDe(g);
    if (lista.length === 0) { items.push({ g, b: null, idx: -1, varios: false }); return; }
    lista.forEach((b, idx) => items.push({ g, b, idx, varios: lista.length > 1 }));
  });
  const total = facturas.reduce((a, g) => a + g.importe, 0);
  const sinFicha = items.filter(x => !x.b).length;
  const valorDe = x => {
    if (!x.b) return x.g.importe;
    if (x.b.importe) return x.b.importe;
    return x.varios ? 0 : x.g.importe;   // si no se detalló, el total es de la factura
  };
  return `
    <div class="toolbar"><div><h2>Bienes de Uso</h2><div class="sub">Maquinaria, vehículos, herramientas y equipos. Una factura puede traer varios bienes: cada uno se lista por separado.</div></div>
      <button class="btn" onclick="openBienNuevo()">+ Cargar bien de uso</button></div>
    <div class="stats">
      <div class="stat"><div class="lbl">Valor total facturado</div><div class="val">${fmt(total)}</div><div class="sub">${facturas.length} ${facturas.length === 1 ? "factura" : "facturas"}</div></div>
      <div class="stat"><div class="lbl">Bienes registrados</div><div class="val">${items.filter(x => x.b).length}</div><div class="sub">ítems individuales</div></div>
      <div class="stat"><div class="lbl">Fichas a completar</div><div class="val" style="color:${sinFicha > 0 ? 'var(--warning)' : 'var(--muted)'}">${sinFicha}</div><div class="sub">${sinFicha > 0 ? "sin datos del bien" : "todas completas"}</div></div>
    </div>
    <div class="panel" style="overflow:hidden">
      ${items.length === 0 ? `<div class="empty">Todavía no cargaste bienes de uso. Registrá un egreso con cuenta "Bienes de Uso" y aparece acá con su ficha.</div>` :
      `<div style="overflow-x:auto"><table><thead><tr><th>Fecha compra</th><th>Bien</th><th>Marca / modelo</th><th>Nro. serie</th><th>Proveedor</th><th>C. costo</th><th class="num">Valor</th><th>Estado</th><th></th></tr></thead><tbody>
      ${items.map(x => { const g = x.g, b = x.b || {}, pd = pendienteDe(g), falta = !x.b; return `<tr>
        <td style="white-space:nowrap">${fmtF(g.fecha)}</td>
        <td style="font-weight:600">${esc(b.descripcion || g.concepto || "—")}
          ${falta ? `<div><span class="badge" style="background:var(--warning)22;color:var(--warning);margin-top:4px">Ficha incompleta</span></div>` : ""}
          ${x.varios ? `<div class="muted" style="font-size:11px">📄 factura con varios bienes${(g.facturaTipo || g.facturaNro) ? " · Fc " + esc(g.facturaTipo) + " " + esc(g.facturaNro) : ""}</div>` : ""}
          ${g.origen === "banco" ? `<div class="muted" style="font-size:11px">🏦 desde extracto</div>` : ""}</td>
        <td class="muted">${esc(b.marca) || "—"}</td>
        <td class="muted" style="font-family:monospace">${esc(b.serie) || "—"}</td>
        <td class="muted">${esc(g.proveedor) || "—"}</td>
        <td class="muted">${proyectoLabel(g.proyecto)}</td>
        <td class="num" style="font-weight:600">${valorDe(x) ? fmt(valorDe(x)) : `<span class="muted">s/detalle</span>`}</td>
        <td>${pd > 0 ? `<span class="badge" style="background:var(--warning)22;color:var(--warning)">Debe ${fmt(pd)}</span>` : `<span class="badge" style="background:var(--success)22;color:var(--success)">Pagado</span>`}</td>
        <td><div style="display:flex;gap:6px">${falta ? `<button class="btn-success btn btn-sm" onclick="openBienFicha('${g.id}')" style="white-space:nowrap">Completar ficha</button>` : `<button class="btn-ghost btn btn-sm" onclick="openBienFicha('${g.id}')" title="Editar bienes de esta factura">🚜</button>`}<button class="btn-ghost btn btn-sm" onclick="openGastoModal('${g.id}')" title="Editar el egreso">✎</button></div></td>
      </tr>`; }).join("")}
      </tbody><tfoot><tr><td colspan="6" style="font-weight:700;color:var(--accent)">TOTAL FACTURADO</td><td class="num" style="font-weight:700">${fmt(total)}</td><td colspan="2"></td></tr></tfoot></table></div>`}
    </div>`;
}
// Completar / editar la ficha del bien sin tocar el resto del egreso.
// Sirve sobre todo para los bienes que entraron desde el extracto del banco.
function openBienFicha(id) {
  const g = DB.get().gastos.find(x => x.id === id); if (!g) return;
  window._fichaGastoId = id;
  bienesTemp = bienesDe(g).map(b => ({ ...b }));
  modalHTML(`
    <p class="muted" style="font-size:13px;margin-bottom:14px">Factura del ${fmtF(g.fecha)} por <b>${fmt(g.importe)}</b>${g.proveedor ? " — " + esc(g.proveedor) : ""}${g.origen === "banco" ? ` <span class="badge" style="background:var(--info)22;color:var(--info)">desde extracto</span>` : ""}. Cargá todos los bienes que trae.</p>
    <div class="field"><label class="field-lbl">Proveedor / a nombre de</label>${selectConNuevo("bf_prov", listaProveedores(), g.proveedor || "", "proveedores")}</div>
    <div id="g_bienes"></div>
  `, "Bienes de la factura", "saveBienFicha('" + id + "')");
  const sel = document.getElementById("bf_prov");
  if (sel && g.proveedor) sel.value = g.proveedor;
  // el panel compara contra el importe de la factura
  const fake = document.createElement("input"); fake.id = "g_imp"; fake.type = "hidden"; fake.value = g.importe;
  document.querySelector(".modal-body").appendChild(fake);
  renderBienesTemp();
}
function saveBienFicha(id) {
  const pend = document.getElementById("gb_desc");
  if (pend && pend.value.trim()) addBienTemp();
  if (bienesTemp.length === 0) { alert("Agregá al menos un bien."); return; }
  const provEl = document.getElementById("bf_prov");
  const prov = (provEl && provEl.value !== "__nuevo__") ? provEl.value.trim() : "";
  const patch = { bienes: bienesTemp.map(b => ({ ...b })), bien: undefined };
  if (prov) patch.proveedor = prov;
  DB.update("gastos", id, patch);
  bienesTemp = []; window._fichaGastoId = null;
  closeModal(); render();
}
// atajo: abre el formulario de egreso con la cuenta "Bienes de Uso" ya elegida
function openBienNuevo() {
  openGastoModal();
  const s = document.getElementById("g_tipo");
  if (s) { s.value = "Bienes de Uso"; gTipoChange(); }
}

function viewClientes() {

  const totalCobrar = porCobrarTotal();

        <span style="font-weight:700">${esc(c.nombre)} <span class="muted" style="font-size:11px;font-weight:400">ver detalle →</span></span>
        <span style="font-weight:700;color:var(--warning)">${fmt(c.total)}</span>
      </div>

      ${c.items.sort((a, b) => (a.fecha || "").localeCompare(b.fecha || "")).map(i => `<tr>
        <td style="white-space:nowrap">${fmtF(i.fecha)}</td>
        <td class="muted">${(i.facturaTipo || i.facturaNro) ? "Fc " + esc(i.facturaTipo) + " " + esc(i.facturaNro) : esc(i.detalle || "—")}</td>

        <td class="num" style="font-weight:600;color:var(--warning)">${fmt(i.montoPendiente || 0)}</td>
        <td><button class="btn-success btn btn-sm" onclick="openCobrarModal('${i.id}')">Cobrar →</button></td>
      </tr>`).join("")}
      </tbody></table></div>
    </div>`).join("")}`;
}
// Cobrar la parte pendiente de una cobranza
function openCobrarModal(id) {
  const i = DB.get().ingresos.find(x => x.id === id); if (!i) return;
  const pend = i.montoPendiente || 0;
  window._cobrarId = id; chequesTemp = [];
  modalHTML(`
    <p class="muted" style="font-size:13px;margin-bottom:14px">Cobrar lo pendiente de <b>${esc(i.cliente || "")}</b> — ${fmt(pend)}. ¿Cómo lo cobrás?</p>
    <div class="field"><label class="field-lbl">Forma de cobro</label><select id="co_forma" onchange="coFormaChange()">
      <option value="efectivo">Efectivo (caja)</option><option value="transferencia">Transferencia (banco)</option><option value="echeque">E-cheque recibido</option></select></div>
    <div class="field"><label class="field-lbl">Fecha</label><input id="co_fecha" type="date" value="${today()}"></div>
    <div id="co_extra"></div>
  `, "Cobrar", "confirmCobrar('" + id + "')");
  coFormaChange();
}
function coFormaChange() {
  const f = document.getElementById("co_forma").value;
  const ex = document.getElementById("co_extra");
  if (f === "echeque") { chequesTemp = []; ex.innerHTML = chequesPanelHTML("co"); window._saldarImporte = (DB.get().ingresos.find(x => x.id === window._cobrarId) || {}).montoPendiente || 0; renderChequesTemp("co"); }
  else ex.innerHTML = "";
}
function confirmCobrar(id) {
  const i = DB.get().ingresos.find(x => x.id === id); if (!i) return;
  const forma = document.getElementById("co_forma").value;
  const fecha = document.getElementById("co_fecha").value;
  const pend = i.montoPendiente || 0;
  // reemplazar la línea ctacte por la forma cobrada
  let cobros = (i.cobros || []).filter(c => c.forma !== "ctacte");
  if (forma === "echeque") {
    if (chequesTemp.length === 0) { alert("Agregá al menos un e-cheque."); return; }
    const tot = chequesTemp.reduce((a, c) => a + c.importe, 0);
    cobros.push({ forma: "echeque", importe: tot });
    // generar cheques RECIBIDOS en la pestaña Cheques
    chequesTemp.forEach(c => DB.add("cheques", { tipo: "recibido", fechaEmision: fecha, fechaPago: c.fechaPago, nro: c.nro, beneficiario: i.cliente || "Cliente", importe: c.importe, refIngreso: id, estado: "pendiente" }));
  } else {
    cobros.push({ forma, importe: pend });
  }
  DB.update("ingresos", id, { cobros, estado: "cobrado", montoPendiente: 0, destino: cobros.some(c => c.forma === "efectivo") ? "caja" : "banco" });
  chequesTemp = []; window._cobrarId = null;
  closeModal(); render();
}
function openClienteDetalle(nombre) {
  const d = DB.get();
  const movs = d.ingresos.filter(i => i.tipo === "Cobranzas" && i.cliente === nombre).sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  const r = clienteResumen(nombre);
